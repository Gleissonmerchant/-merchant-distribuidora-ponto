<!doctype html>

<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<title>Merchant Distribuidora • Administração</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:
    radial-gradient(circle at top,#24344d 0,#111827 42%,#0b1220 100%);
  color:#111827;
  min-height:100vh;
}
.container{
  width:100%;
  max-width:760px;
  margin:auto;
  padding:18px 14px 40px;
}
/* CABEÇALHO */
.header{
  text-align:center;
  color:white;
  margin-bottom:20px;
}
.logo-box{
  width:82px;
  height:82px;
  margin:0 auto 12px;
  background:white;
  border-radius:22px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:28px;
  font-weight:900;
  color:#111827;
  box-shadow:0 10px 30px rgba(0,0,0,.28);
}
.header h1{
  margin:0;
  font-size:25px;
  font-weight:800;
  letter-spacing:-.4px;
}
.header p{
  margin:6px 0 0;
  color:#cbd5e1;
  font-size:14px;
}
/* CARDS */
.card{
  background:rgba(255,255,255,.98);
  border-radius:22px;
  padding:18px;
  margin-bottom:16px;
  box-shadow:0 12px 35px rgba(0,0,0,.20);
}
.card-title{
  display:flex;
  align-items:center;
  gap:9px;
  margin:0 0 16px;
  font-size:19px;
  font-weight:800;
}
/* LOGIN */
input{
  width:100%;
  padding:15px;
  border:1px solid #d1d5db;
  border-radius:13px;
  font-size:16px;
  margin-bottom:11px;
  outline:none;
  background:#f9fafb;
}
input:focus{
  border-color:#2563eb;
  box-shadow:0 0 0 3px rgba(37,99,235,.12);
}
button{
  width:100%;
  border:0;
  border-radius:13px;
  padding:15px;
  font-size:16px;
  font-weight:800;
  cursor:pointer;
}
.btn-blue{
  background:#2563eb;
  color:white;
}
.btn-blue:active{
  transform:scale(.99);
}
.btn-red{
  background:#dc2626;
  color:white;
}
.hidden{
  display:none!important;
}
/* AÇÕES */
.top-actions{
  display:grid;
  grid-template-columns:1fr 110px;
  gap:10px;
  margin-bottom:16px;
}
/* RESUMO */
.resumo-titulo{
  margin-bottom:12px;
}
.resumo{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}
.resumo-item{
  position:relative;
  overflow:hidden;
  background:#f8fafc;
  border:1px solid #e5e7eb;
  padding:16px;
  border-radius:17px;
}
.resumo-item::after{
  content:"";
  position:absolute;
  right:-22px;
  top:-22px;
  width:70px;
  height:70px;
  border-radius:50%;
  background:#dbeafe;
}
.resumo-numero{
  display:block;
  position:relative;
  z-index:1;
  font-size:30px;
  font-weight:900;
  color:#111827;
  margin-bottom:5px;
}
.resumo-label{
  position:relative;
  z-index:1;
  color:#64748b;
  font-size:13px;
  font-weight:700;
}
.mes-atual{
  margin-top:13px;
  padding:11px 13px;
  border-radius:12px;
  background:#eff6ff;
  color:#1e40af;
  font-size:13px;
  font-weight:700;
  text-align:center;
}
/* STATUS */
.status{
  padding:12px 14px;
  border-radius:12px;
  background:#f1f5f9;
  color:#475569;
  margin:16px 0;
  text-align:center;
  font-size:13px;
  font-weight:700;
}
/* REGISTROS */
.registro{
  border:1px solid #e2e8f0;
  border-radius:19px;
  padding:16px;
  margin-bottom:13px;
  background:white;
  box-shadow:0 5px 18px rgba(15,23,42,.07);
}
.funcionario{
  display:flex;
  align-items:center;
  gap:10px;
  padding-bottom:13px;
  border-bottom:1px solid #eef2f7;
}
.avatar{
  width:43px;
  height:43px;
  flex-shrink:0;
  border-radius:50%;
  background:#e0e7ff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:20px;
}
.nome{
  font-size:17px;
  font-weight:900;
  color:#111827;
}
.data{
  margin-top:3px;
  color:#64748b;
  font-size:12px;
}
.horarios{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:9px;
  margin-top:13px;
}
.horario-box{
  padding:12px;
  border-radius:14px;
}
.entrada{
  background:#ecfdf5;
  border:1px solid #bbf7d0;
}
.saida{
  background:#fef2f2;
  border:1px solid #fecaca;
}
.horario-label{
  font-size:11px;
  font-weight:800;
  margin-bottom:4px;
}
.entrada .horario-label{
  color:#15803d;
}
.saida .horario-label{
  color:#b91c1c;
}
.horario-valor{
  font-size:16px;
  font-weight:900;
}
.horas-box{
  margin-top:10px;
  padding:13px;
  border-radius:14px;
  background:#eff6ff;
  border:1px solid #bfdbfe;
  text-align:center;
}
.horas-label{
  color:#1d4ed8;
  font-size:11px;
  font-weight:800;
  display:block;
  margin-bottom:3px;
}
.horas-valor{
  color:#1e3a8a;
  font-size:23px;
  font-weight:900;
}
/* LOCALIZAÇÃO */
.localizacao{
  display:block;
  margin-top:11px;
  padding:12px;
  border-radius:13px;
  background:#f8fafc;
  border:1px solid #e2e8f0;
  color:#2563eb;
  text-decoration:none;
  font-size:13px;
  font-weight:800;
  text-align:center;
}
.localizacao:active{
  background:#eff6ff;
}
.sem-local{
  margin-top:10px;
  padding:10px;
  border-radius:12px;
  background:#f8fafc;
  color:#94a3b8;
  text-align:center;
  font-size:12px;
}
/* VAZIO / ERRO */
.vazio{
  text-align:center;
  padding:30px 10px;
  color:#64748b;
  font-size:14px;
}
.erro{
  background:#fee2e2;
  color:#991b1b;
  padding:13px;
  border-radius:12px;
  margin-top:12px;
  font-size:13px;
  font-weight:700;
}
/* CELULAR */
@media(max-width:430px){
  .container{
    padding:14px 10px 30px;
  }
  .header h1{
    font-size:22px;
  }
  .card{
    padding:15px;
    border-radius:19px;
  }
  .resumo{
    gap:9px;
  }
  .resumo-item{
    padding:14px 12px;
  }
  .resumo-numero{
    font-size:27px;
  }
  .top-actions{
    grid-template-columns:1fr 95px;
  }
  .horarios{
    gap:7px;
  }
  .horario-valor{
    font-size:15px;
  }
}
@media(max-width:350px){
  .resumo{
    grid-template-columns:1fr;
  }
  .horarios{
    grid-template-columns:1fr;
  }
}
</style>
</head>
<body>
<div class="container">
  <!-- CABEÇALHO -->
  <div class="header">
<div class="logo-box">
  MD
</div>
<h1>Merchant Distribuidora</h1>
<p>Painel Administrativo</p>
  </div>
  <!-- LOGIN -->
  <div class="card" id="loginCard">
<h2 class="card-title">
  🔐 Acesso administrativo
</h2>
<input
  type="email"
  id="email"
  placeholder="E-mail do administrador"
  autocomplete="username">
<input
  type="password"
  id="senha"
  placeholder="Senha"
  autocomplete="current-password">
<button
  class="btn-blue"
  onclick="entrarAdmin()">
  Entrar
</button>
<div id="loginMensagem"></div>
  </div>
  <!-- PAINEL -->
  <div id="painel" class="hidden">
<div class="top-actions">
  <button
    class="btn-blue"
    onclick="carregarRegistros()">
    🔄 Atualizar registros
  </button>
  <button
    class="btn-red"
    onclick="sairAdmin()">
    Sair
  </button>
</div>
<!-- RESUMO DO MÊS -->
<div class="card">
  <h2 class="card-title">
    📊 Resumo do mês
  </h2>
  <div class="resumo">
    <div class="resumo-item">
      <span
        class="resumo-numero"
        id="totalRegistros">
        0
      </span>
      <span class="resumo-label">
        Registros
      </span>
    </div>
    <div class="resumo-item">
      <span
        class="resumo-numero"
        id="totalFuncionarios">
        0
      </span>
      <span class="resumo-label">
        Funcionários
      </span>
    </div>
  </div>
  <div
    class="mes-atual"
    id="mesAtual">
    Resumo do mês atual
  </div>
  <div
    class="status"
    id="status">
    Carregando registros...
  </div>
  <div id="listaRegistros"></div>
</div>
  </div>
</div>
<script>
const SUPABASE_URL =
"https://paegduddojnlxyqssert.supabase.co";
const SUPABASE_KEY =
"sb_publishable_e70A8BQcnZ0o6XB-aXSbzg_p3pDeenk";
const supabaseClient =
supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);
/* =========================
   LOGIN
========================= */
async function entrarAdmin(){
  const email =
    document
      .getElementById("email")
      .value
      .trim();
  const senha =
    document
      .getElementById("senha")
      .value;
  const mensagem =
    document
      .getElementById("loginMensagem");
  mensagem.innerHTML = "";
  if(!email || !senha){
    mensagem.innerHTML =
      '<div class="erro">Digite o e-mail e a senha.</div>';
    return;
  }
  try{
    const {data,error} =
      await supabaseClient.auth.signInWithPassword({
        email:email,
        password:senha
      });
    if(error) throw error;
    const {data:perfil,error:erroPerfil} =
      await supabaseClient
        .from("perfis_usuario")
        .select("papel")
        .eq("id",data.user.id)
        .maybeSingle();
    if(erroPerfil) throw erroPerfil;
    if(!perfil || perfil.papel !== "admin"){
      await supabaseClient.auth.signOut();
      mensagem.innerHTML =
        '<div class="erro">Este usuário não possui acesso administrativo.</div>';
      return;
    }
    document
      .getElementById("loginCard")
      .classList.add("hidden");
    document
      .getElementById("painel")
      .classList.remove("hidden");
    carregarRegistros();
  }
  catch(error){
    console.error(error);
    mensagem.innerHTML =
      '<div class="erro">Não foi possível entrar: ' +
      escapeHtml(error.message) +
      '</div>';
  }
}
/* =========================
   CARREGAR REGISTROS
========================= */
async function carregarRegistros(){
  const status =
    document.getElementById("status");
  const lista =
    document.getElementById("listaRegistros");
  status.textContent =
    "Carregando registros...";
  lista.innerHTML = "";
  try{
    const {data,error} =
      await supabaseClient
        .from("painel_admin_ponto")
        .select("*")
        .order("entrada",{ascending:false})
        .limit(200);
    if(error) throw error;
    if(!data || data.length === 0){
      document
        .getElementById("totalRegistros")
        .textContent = "0";
      document
        .getElementById("totalFuncionarios")
        .textContent = "0";
      status.textContent =
        "Nenhum registro encontrado.";
      lista.innerHTML =
        '<div class="vazio">Ainda não existem registros de ponto.</div>';
      return;
    }
    /* RESUMO */
    const agora = new Date();
    const mesAtual = agora.getMonth();
    const anoAtual = agora.getFullYear();
    const registrosMes =
      data.filter(item => {
        if(!item.entrada) return false;
        const d = new Date(item.entrada);
        return (
          d.getMonth() === mesAtual &&
          d.getFullYear() === anoAtual
        );
      });
    const funcionarios =
      new Set(
        registrosMes.map(item =>
          item.funcionario
        )
      );
    document
      .getElementById("totalRegistros")
      .textContent =
      registrosMes.length;
    document
      .getElementById("totalFuncionarios")
      .textContent =
      funcionarios.size;
    document
      .getElementById("mesAtual")
      .textContent =
      "📅 " +
      agora.toLocaleDateString(
        "pt-BR",
        {
          month:"long",
          year:"numeric"
        }
      )
      .replace(/^./,c => c.toUpperCase());
    status.textContent =
      data.length +
      " registro(s) carregado(s).";
    /* LISTA */
    data.forEach(registro => {
      const div =
        document.createElement("div");
      div.className =
        "registro";
      const entrada =
        formatarDataHora(
          registro.entrada
        );
      const saida =
        registro.saida
          ? formatarDataHora(registro.saida)
          : "Ainda não registrada";
      const horas =
        registro.horas_trabalhadas
          ? registro.horas_trabalhadas
          : calcularHoras(
              registro.entrada,
              registro.saida
            );
      let local = "";
      if(
        registro.latitude !== null &&
        registro.longitude !== null &&
        registro.latitude !== undefined &&
        registro.longitude !== undefined
      ){
        const latitude =
          encodeURIComponent(
            registro.latitude
          );
        const longitude =
          encodeURIComponent(
            registro.longitude
          );
        local =
          `
          <a
            class="localizacao"
            href="https://www.google.com/maps?q=${latitude},${longitude}"
            target="_blank"
            rel="noopener">
            📍 Abrir localização no mapa
          </a>
          `;
      }
      else{
        local =
          `
          <div class="sem-local">
            📍 Localização não registrada
          </div>
          `;
      }
      div.innerHTML = `
        <div class="funcionario">
          <div class="avatar">
            👤
          </div>
          <div>
            <div class="nome">
              ${escapeHtml(
                registro.funcionario ||
                "Sem nome"
              )}
            </div>
            <div class="data">
              📅 ${escapeHtml(
                registro.data || "-"
              )}
            </div>
          </div>
        </div>
        <div class="horarios">
          <div class="horario-box entrada">
            <div class="horario-label">
              🟢 ENTRADA
            </div>
            <div class="horario-valor">
              ${entrada}
            </div>
          </div>
          <div class="horario-box saida">
            <div class="horario-label">
              🔴 SAÍDA
            </div>
            <div class="horario-valor">
              ${saida}
            </div>
          </div>
        </div>
        <div class="horas-box">
          <span class="horas-label">
            ⏱️ HORAS TRABALHADAS
          </span>
          <span class="horas-valor">
            ${escapeHtml(
              horas || "00:00"
            )}
          </span>
        </div>
        ${local}
      `;
      lista.appendChild(div);
    });
  }
  catch(error){
    console.error(error);
    status.textContent =
      "Erro ao carregar.";
    lista.innerHTML =
      '<div class="erro">Erro ao carregar os registros: ' +
      escapeHtml(error.message) +
      '</div>';
  }
}
/* =========================
   CALCULAR HORAS
========================= */
function calcularHoras(entrada,saida){
  if(!entrada || !saida)
    return "Em andamento";
  const inicio =
    new Date(entrada);
  const fim =
    new Date(saida);
  const segundos =
    Math.max(
      0,
      Math.floor(
        (fim-inicio)/1000
      )
    );
  const horas =
    Math.floor(
      segundos/3600
    );
  const minutos =
    Math.floor(
      (segundos%3600)/60
    );
  return String(horas)
    .padStart(2,"0")
    + ":" +
    String(minutos)
    .padStart(2,"0");
}
/* =========================
   DATA / HORA
========================= */
function formatarDataHora(valor){
  if(!valor) return "-";
  const data =
    new Date(valor);
  if(isNaN(data.getTime()))
    return escapeHtml(
      String(valor)
    );
  return data.toLocaleString(
    "pt-BR",
    {
      dateStyle:"short",
      timeStyle:"short"
    }
  );
}
/* =========================
   SAIR
========================= */
async function sairAdmin(){
  await supabaseClient
    .auth
    .signOut();
  document
    .getElementById("painel")
    .classList.add("hidden");
  document
    .getElementById("loginCard")
    .classList.remove("hidden");
  document
    .getElementById("senha")
    .value = "";
}
/* =========================
   SEGURANÇA DE TEXTO
========================= */
function escapeHtml(text){
  return String(text)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}
/* =========================
   VERIFICAR SESSÃO
========================= */
async function verificarSessao(){
  const {data} =
    await supabaseClient
      .auth
      .getSession();
  if(data.session){
    const {data:perfil} =
      await supabaseClient
        .from("perfis_usuario")
        .select("papel")
        .eq("id",data.session.user.id)
        .maybeSingle();
    if(
      perfil &&
      perfil.papel === "admin"
    ){
      document
        .getElementById("loginCard")
        .classList.add("hidden");
      document
        .getElementById("painel")
        .classList.remove("hidden");
      carregarRegistros();
    }
  }
}
verificarSessao();
</script>
</body>
</html>
