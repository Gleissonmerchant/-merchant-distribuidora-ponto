<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Merchant Distribuidora • Ponto</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:linear-gradient(135deg,#eef2f7,#dfe6ee);min-height:100vh;padding:22px;color:#18212b}
.wrap{max-width:480px;margin:auto}.brand{background:#111827;color:#fff;border-radius:22px 22px 0 0;padding:25px 24px}
.brand h1{margin:0;font-size:25px}.brand p{margin:6px 0 0;color:#cbd5e1}
.card{background:#fff;padding:24px;border-radius:0 0 22px 22px;box-shadow:0 18px 50px #0002}
label{display:block;font-weight:700;margin:0 0 7px}.field{width:100%;padding:14px;border:1px solid #d7dde5;border-radius:12px;font-size:16px;margin-bottom:18px}
button{width:100%;padding:15px;border:0;border-radius:12px;color:#fff;font-size:16px;font-weight:800;margin:6px 0;cursor:pointer}
.in{background:#198754}.out{background:#dc3545}.status{margin-top:18px;padding:15px;background:#f6f8fa;border-radius:12px;white-space:pre-wrap;font-size:14px}
.note{font-size:12px;color:#687386;text-align:center;margin-top:16px}
</style></head>
<body><div class="wrap">
<div class="brand"><h1>Merchant Distribuidora</h1><p>Registro de entrada e saída</p></div>
<div class="card">
<label for="nome">Nome</label><input id="nome" class="field" placeholder="Digite seu nome" autocomplete="name">
<button class="in" onclick="registrar('entrada')">✓ Registrar entrada</button>
<button class="out" onclick="registrar('saída')">✓ Registrar saída</button>
<div id="status" class="status">Pronto para registrar.</div>
<div class="note">A localização será solicitada pelo navegador somente no momento do registro.</div>
</div></div>
<script>
const DESTINO="5588997104036";
function registrar(tipo){
 const nome=document.getElementById('nome').value.trim();
 if(!nome){alert('Digite seu nome antes de registrar.');return}
 if(!navigator.geolocation){document.getElementById('status').textContent='Localização não disponível neste navegador.';return}
 document.getElementById('status').textContent='Obtendo localização...';
 navigator.geolocation.getCurrentPosition(p=>{
   const d=new Date(), data=d.toLocaleDateString('pt-BR'), hora=d.toLocaleTimeString('pt-BR');
   const lat=p.coords.latitude.toFixed(6), lon=p.coords.longitude.toFixed(6);
   const mapa=`https://www.google.com/maps?q=${lat},${lon}`;
   const msg=`🏢 MERCHANT DISTRIBUIDORA\n📋 REGISTRO DE ${tipo.toUpperCase()}\n👤 Nome: ${nome}\n📅 Data: ${data}\n🕐 Horário: ${hora}\n📍 Localização: ${lat}, ${lon}\n🗺️ Mapa: ${mapa}`;
   document.getElementById('status').textContent=msg;
   location.href=`https://wa.me/${DESTINO}?text=${encodeURIComponent(msg)}`;
 },()=>{document.getElementById('status').textContent='Não foi possível obter a localização. Autorize a localização e tente novamente.'},{enableHighAccuracy:true,timeout:15000,maximumAge:0});
}
</script></body></html>
